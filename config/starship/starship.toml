"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
[](#9A348E)\
$os\
$username\
[](bg:#DA627D fg:#9A348E)\
$directory\
[](fg:#DA627D bg:#FCA17D)\
$git_branch\
$git_state\
$git_status\
[](fg:#FCA17D bg:#86BBD8)\
$php\
[](fg:#86BBD8 bg:#06969A)\
$time\
[](fg:#06969A bg:#33658A)\
$cmd_duration\
[ ](fg:#33658A)\
$line_break\
$character\
"""

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#9A348E"
style_root = "bg:#9A348E"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#9A348E"
disabled = true # Disabled by default

[directory]
style = "bg:#DA627D"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#FCA17D"
format = '[ $symbol $branch ]($style)'

[git_state]
style = "bg:#FCA17D"

[git_status]
style = "bg:#FCA17D"
format = '[$all_status$ahead_behind ]($style)'

[rust]
symbol = ""
style = "bg:#86bbd8"
format = '[ $symbol ($version) ]($style)'

[php]
symbol = "🐘"
style = "bg:#86bbd8"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#06969A"
format = '[ ♥ $time ]($style)'

[cmd_duration]
style = "bg:#33658A"
format = '[ took $duration ]($style)'
